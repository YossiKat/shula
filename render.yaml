services:
  - type: web
    name: shula
    runtime: python
    rootDir: engine
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: MONDAY_API_TOKEN
        sync: false
      - key: MONDAY_ANYCAN_API_TOKEN
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
